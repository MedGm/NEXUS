x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'cMFVHlCCMqABVxoiDiPFkzYEqmMkW3hErAyJD1WQJVY='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: "scipy river>=0.21.0 'mlflow>=2.13.0,<3.0' boto3 psycopg2-binary great-expectations>=0.18.0,<0.19 pyyaml"
    POSTGRES_META_DSN: postgresql://postgres:postgres@postgres/nexus_meta
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    KS_THRESHOLD: "0.15"
    KS_MIN_SAMPLES: "50"
    SHADOW_COMPLETION_N: "1000"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - nexus

services:

  # ── Zookeeper ────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - nexus
    healthcheck:
      test: echo ruok | nc localhost 2181 | grep imok
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexus
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka Topic Init ─────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        TOPICS='nexus.raw.events nexus.validated nexus.anomalies nexus.incidents';
        for topic in $$TOPICS; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --replication-factor 1 \
            --config retention.ms=604800000;
          echo \"Topic $$topic ready.\";
        done
      "
    networks:
      - nexus

  # ── Kafka JMX Exporter ───────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - '--kafka.server=kafka:29092'
      - '--web.listen-address=:9308'
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks:
      - nexus
    restart: unless-stopped
    healthcheck:
      test: wget -qO- http://localhost:9308/metrics | head -1
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Schema Registry ──────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - nexus
    healthcheck:
      test: curl -sf http://localhost:8081/subjects
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - nexus
    healthcheck:
      test: pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - nexus
    healthcheck:
      test: curl -sf http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-05-24T09-08-49Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/mlflow;
        mc mb --ignore-existing local/raw-data;
        mc mb --ignore-existing local/processed;
        mc mb --ignore-existing local/model-artifacts;
        mc mb --ignore-existing local/replay-snapshots;
        exit 0;
      "
    networks:
      - nexus

  # ── MLflow ───────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://postgres:postgres@postgres/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow
      MLFLOW_SERVE_ARTIFACTS: "true"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://mlflow
    entrypoint: ["/bin/sh", "-c", "pip install --quiet psycopg2-binary boto3 && gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 mlflow.server:app"]
    networks:
      - nexus
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Init ─────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@nexus.local
    restart: on-failure

  # ── Airflow Webserver ────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: curl -sf http://localhost:8080/health
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Airflow Scheduler ────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - nexus
    healthcheck:
      test: wget -qO- http://localhost:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nexus
    healthcheck:
      test: curl -sf http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Phase 03 Migration ───────────────────────────────────
  nexus-migrate:
    image: postgres:16
    container_name: nexus-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/migrate-phase03.sql:/migrate.sql:ro
    entrypoint: >
      /bin/sh -c "psql -h postgres -U postgres -d nexus_metrics -f /migrate.sql"
    networks:
      - nexus

  # ── Phase 04 Migration ───────────────────────────────────
  nexus-migrate-04:
    image: postgres:16
    container_name: nexus-migrate-04
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/migrate-phase04-metrics.sql:/migrate-metrics.sql:ro
      - ./scripts/migrate-phase04-meta.sql:/migrate-meta.sql:ro
    entrypoint: >
      /bin/sh -c "
        psql -h postgres -U postgres -d nexus_metrics -f /migrate-metrics.sql &&
        psql -h postgres -U postgres -d nexus_meta -f /migrate-meta.sql
      "
    networks:
      - nexus

  # ── Phase 04b Migration ──────────────────────────────────
  nexus-migrate-04b:
    image: postgres:16
    container_name: nexus-migrate-04b
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/migrate-phase04b.sql:/migrate.sql:ro
    entrypoint: >
      /bin/sh -c "psql -h postgres -U postgres -d nexus_meta -f /migrate.sql"
    networks:
      - nexus

  # ── Phase 05 Migration ──────────────────────────────────
  nexus-migrate-05:
    image: postgres:16
    container_name: nexus-migrate-05
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/migrate-phase05.sql:/migrate.sql:ro
    entrypoint: >
      /bin/sh -c "psql -h postgres -U postgres -d nexus_incidents -f /migrate.sql"
    networks:
      - nexus

  # ── Validator ────────────────────────────────────────────
  validator:
    build:
      context: ./services
      dockerfile: validator/Dockerfile
    container_name: validator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nexus-migrate:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_DSN: postgresql://postgres:postgres@postgres/nexus_metrics
      TRUST_MAX_AGE_SECONDS: "300"
      VALIDATOR_FLUSH_SECONDS: "60"
    networks:
      - nexus
    restart: unless-stopped

  # ── Trust API ────────────────────────────────────────────
  trust-api:
    build:
      context: ./services
      dockerfile: trust-api/Dockerfile
    container_name: trust-api
    depends_on:
      postgres:
        condition: service_healthy
      nexus-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres/nexus_metrics
    networks:
      - nexus
    restart: unless-stopped

  # ── Anomaly Detector ─────────────────────────────────────
  anomaly-detector:
    build:
      context: ./services
      dockerfile: anomaly-detector/Dockerfile
    container_name: anomaly-detector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      nexus-migrate-04:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      ANOMALY_CHECKPOINT_EVERY: "1000"
      THRESHOLD_ORDER: "0.75"
      THRESHOLD_PAYMENT: "0.80"
      THRESHOLD_SESSION: "0.75"
      THRESHOLD_REC: "0.70"
    networks:
      - nexus
    restart: unless-stopped

  # ── Inference API ─────────────────────────────────────────
  inference-api:
    build:
      context: ./services
      dockerfile: inference-api/Dockerfile
    container_name: inference-api
    depends_on:
      postgres:
        condition: service_healthy
      nexus-migrate-04:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres/nexus_metrics
      POSTGRES_META_DSN: postgresql://postgres:postgres@postgres/nexus_meta
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      INFERENCE_LAG_THRESHOLD_MS: "5000"
      TRUST_GATE_THRESHOLD: "0.6"
      THRESHOLD_ORDER: "0.75"
      THRESHOLD_PAYMENT: "0.80"
      THRESHOLD_SESSION: "0.75"
      THRESHOLD_REC: "0.70"
    networks:
      - nexus
    restart: unless-stopped

  # ── Incident Engine ─────────────────────────────────────
  incident-engine:
    build:
      context: ./services
      dockerfile: incident-engine/Dockerfile
    image: nexus-incident-engine
    container_name: incident-engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nexus-migrate-05:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_INCIDENTS_DSN: postgresql://postgres:postgres@postgres/nexus_incidents
      POSTGRES_METRICS_DSN: postgresql://postgres:postgres@postgres/nexus_metrics
      POSTGRES_META_DSN: postgresql://postgres:postgres@postgres/nexus_meta
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INCIDENT_IDLE_TIMEOUT_SECONDS: "600"
      KAFKA_LAG_THRESHOLD: "5000"
      TRUST_DROP_THRESHOLD: "0.15"
      REPLAY_TIMEOUT_SECONDS: "30"
    restart: unless-stopped
    networks:
      - nexus

  # ── Dashboard ─────────────────────────────────────────────
  nexus-dashboard:
    build:
      context: ./services
      dockerfile: dashboard/Dockerfile
    image: nexus-dashboard
    container_name: nexus-dashboard
    depends_on:
      trust-api:
        condition: service_started
      incident-engine:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      TRUST_API_URL: http://trust-api:8000
      INCIDENT_API_URL: http://incident-engine:8002
      PROMETHEUS_URL: http://prometheus:9090
      POSTGRES_META_DSN: postgresql://postgres:postgres@postgres/nexus_meta
      SIMULATOR_URL: http://simulator:8003
    restart: unless-stopped
    networks:
      - nexus

  # ── Simulator ────────────────────────────────────────────
  simulator:
    build:
      context: ./services
      dockerfile: simulator/Dockerfile
    container_name: simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SIMULATOR_BASE_RATE: "10"
      SIMULATOR_CONTROL_PORT: "8003"
    networks:
      - nexus
    restart: unless-stopped

  # ── API Poller ───────────────────────────────────────────
  api-poller:
    build:
      context: ./services
      dockerfile: api-poller/Dockerfile
    container_name: api-poller
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POLLER_INTERVAL_SECONDS: "60"
    networks:
      - nexus
    restart: unless-stopped

  # ── Lake Writer ──────────────────────────────────────────
  lake-writer:
    build:
      context: ./services
      dockerfile: lake-writer/Dockerfile
    container_name: lake-writer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      LAKE_WRITER_FLUSH_SECONDS: "60"
    networks:
      - nexus
    restart: unless-stopped

networks:
  nexus:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
