global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: minio
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  # ── App services — add containers here as they're built ──
  - job_name: nexus-services
    static_configs:
      - targets: ['trust-api:8000', 'inference-api:8001', 'incident-engine:8002']
    metrics_path: /metrics
