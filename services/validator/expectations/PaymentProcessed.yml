dataset_id: PaymentProcessed
lineage_depth: 1
min_reference_batches: 10
psi_columns: [amount_usd]
expectations:
  - type: expect_column_values_to_not_be_null
    kwargs: {column: payment_id}
  - type: expect_column_values_to_not_be_null
    kwargs: {column: order_id}
  - type: expect_column_values_to_not_be_null
    kwargs: {column: method}
  - type: expect_column_values_to_not_be_null
    kwargs: {column: status}
  - type: expect_column_values_to_be_between
    kwargs: {column: amount_usd, min_value: 0.0}
  - type: expect_column_to_exist
    kwargs: {column: timestamp}
